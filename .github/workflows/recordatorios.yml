name: Procesar recordatorios de turnos

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: procesar-recordatorios
  cancel-in-progress: false

jobs:
  procesar-recordatorios:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5
    steps:
      - name: Invocar endpoint de recordatorios
        env:
          BASE_URL: ${{ vars.RECORDATORIOS_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Faltan RECORDATORIOS_BASE_URL o CRON_SECRET en la configuración del repositorio."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --request GET \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/recordatorios/procesar"
